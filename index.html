<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Cube with Clouds</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEFA; /* sky blue */
    }

    #colorPicker {
      position: absolute;
      display: none;
      z-index: 10;
      border: none;
      background: none;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <input type="color" id="colorPicker" />

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x87CEFA);
    document.body.appendChild(renderer.domElement);

    // 🌟 Cube: original size with rounded corners
    const size = 1.6; 
    const radius = 0.2;
    const segments = 16;
    const geometry = new THREE.BoxGeometry(size, size, size, segments, segments, segments);

    const pos = geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let y = pos.getY(i);
      let z = pos.getZ(i);
      const factor = radius / size; 
      x -= Math.sign(x) * factor;
      y -= Math.sign(y) * factor;
      z -= Math.sign(z) * factor;
      pos.setXYZ(i, x, y, z);
    }
    geometry.computeVertexNormals();

    const baseColor = new THREE.Color(0xff00ff); // vibrant magenta
    const vibrantColor = baseColor.clone().offsetHSL(0, 0.15, 0.15);
    const materials = Array.from({ length: 6 }, () =>
      new THREE.MeshStandardMaterial({
        color: vibrantColor,
        metalness: 0.5,
        roughness: 0.25,
        emissive: 0x220022,
      })
    );

    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    // 👁️ Eyeball
    const eyeball = new THREE.Mesh(
      new THREE.SphereGeometry(0.32, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.2 })
    );

    const pupil = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.05 })
    );
    pupil.position.z = 0.29; 
    eyeball.add(pupil);

    const upperLid = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, 0, Math.PI/2),
      new THREE.MeshStandardMaterial({ color: vibrantColor, metalness:0.5, roughness:0.25 })
    );
    upperLid.position.y = 0.12;
    eyeball.add(upperLid);

    const lowerLid = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 32, 32, 0, Math.PI*2, Math.PI/2, Math.PI/2),
      new THREE.MeshStandardMaterial({ color: vibrantColor, metalness:0.5, roughness:0.25 })
    );
    lowerLid.position.y = -0.12;
    eyeball.add(lowerLid);

    eyeball.position.z = 0.60; // slightly pushed inward
    cube.add(eyeball);

    // ☁️ Clouds (2 textures)
    const loader = new THREE.TextureLoader();
    const cloudTextures = [
      loader.load('assets/cloud1.png'),
      loader.load('assets/cloud2.png')
    ];

    const clouds = [];
    for(let i=0; i<50; i++){ // more clouds for fuller coverage
      const tex = cloudTextures[i % cloudTextures.length];
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(new THREE.PlaneGeometry(10,10), mat);
      plane.position.set(Math.random()*60-30, Math.random()*40-20, Math.random()*-60-10);
      plane.rotation.z = Math.random()*Math.PI*2;
      plane.userData.speed = 0.01 + Math.random()*0.015; // faster speed
      scene.add(plane);
      clouds.push(plane);
    }

    // 💡 Lights
    const pointLight = new THREE.PointLight(0xffffff,1.3);
    pointLight.position.set(3,3,6);
    scene.add(pointLight);
    const fillLight = new THREE.PointLight(0xff88ff,0.8);
    fillLight.position.set(-3,-2,-5);
    scene.add(fillLight);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    // 😴 Eyeball blink
    let blink=0, blinking=false;
    setInterval(()=>blinking=true,2500);

    // 🎨 Color picker
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const colorInput = document.getElementById("colorPicker");
    let activeFace = -1;

    function onPointerDown(event){
      if(event.target === colorInput) return;
      mouse.x = (event.clientX / window.innerWidth)*2-1;
      mouse.y = -(event.clientY / window.innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const intersects = raycaster.intersectObject(cube);
      if(intersects.length){
        activeFace = Math.floor(intersects[0].faceIndex/2);
        colorInput.style.left=`${event.clientX-24}px`;
        colorInput.style.top=`${event.clientY-20}px`;
        colorInput.style.display='block';
        colorInput.click();
      }else{
        colorInput.style.display='none';
        activeFace=-1;
      }
    }

    function applyColor(e){
      if(activeFace>=0){
        const col = new THREE.Color(e.target.value);
        col.offsetHSL(0,0,0.15);
        materials[activeFace].color.set(col);
        upperLid.material.color.set(col);
        lowerLid.material.color.set(col);
      }
    }

    colorInput.addEventListener('input',applyColor);
    colorInput.addEventListener('change',applyColor);
    colorInput.addEventListener('pointerdown',ev=>ev.stopPropagation());
    window.addEventListener('pointerdown',onPointerDown);

    // 🌀 Animate
    function animate(){
      requestAnimationFrame(animate);
      cube.rotation.x += 0.0075;
      cube.rotation.y += 0.01;

      if(blinking){
        blink += 0.25;
        eyeball.scale.y = Math.abs(Math.cos(blink));
        if(blink>Math.PI){
          blink=0;
          blinking=false;
          eyeball.scale.y=1;
        }
      }

      clouds.forEach(cloud=>{
        cloud.position.x += cloud.userData.speed;
        if(cloud.position.x > 35) cloud.position.x = -35;
      });

      renderer.render(scene,camera);
    }
    animate();

    // 🔧 Responsive
    window.addEventListener('resize',()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
